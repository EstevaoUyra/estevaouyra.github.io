<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Site pessoal de Estevão Uyrá.">
<title>Estevão Uyrá</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F6F3; --surface:#FFFFFF; --ink:#18221F; --muted:#5C6A65; --line:#DCE3DF;
  --accent:#0D6B5B; --accent-soft:#DDEFE9;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211E; --ink:#E7EEEA; --muted:#9AA8A2; --line:#2A3733;
  --accent:#4FC2A8; --accent-soft:#16332C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211E; --ink:#E7EEEA; --muted:#9AA8A2; --line:#2A3733;
  --accent:#4FC2A8; --accent-soft:#16332C; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
header{padding-block:56px 24px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,7vw,52px);line-height:1.02;margin:0;letter-spacing:-.01em}
.lede{color:var(--muted);margin:10px 0 0}
h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:24px 0 10px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li a{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
li a:hover{border-color:var(--accent)}
li a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
li b{display:block;font-family:var(--display);font-weight:600;font-size:20px;line-height:1.15;color:var(--accent)}
li span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Estevão Uyrá</h1>
</header>

<h2>Páginas</h2>
<ul>
  <li><a href="bora-frequentar/"><b>Bora frequentar SP</b><span>38 bares e restaurantes de São Paulo que se posicionaram a favor da democracia, com mapa, filtros e links.</span></a></li>
</ul>
</div>
</body>
</html>
